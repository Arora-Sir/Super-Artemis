name: Docs and credits check

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5
        with:
          python-version: '3.12'

      - name: Credits table matches credits.json
        run: python scripts/render_credits.py --check

      - name: Project docs have no em dashes or double hyphens
        run: python scripts/clean_dashes.py --check ARCHITECTURE.md BUGS.md SETUP.md CHANGELOG.md CONTEXT.md UPSTREAM.md PRIVACY.md RELEASING.md docs/lock-key-options.md CLAUDE.md .github/CONTRIBUTING.md
