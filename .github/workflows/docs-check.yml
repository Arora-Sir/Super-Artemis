name: Docs and credits check

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Credits table matches credits.json
        run: python scripts/render_credits.py --check

      - name: Project docs have no em dashes or double hyphens
        run: python scripts/clean_dashes.py --check ARCHITECTURE.md BUGS.md SETUP.md CHANGELOG.md CONTEXT.md .github/CONTRIBUTING.md
