name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    # NOTE: Secrets are only reachable from tag pushes in this repository, never from forks or pull requests.
    # NOTE: The release environment holds the four secrets and requires a reviewer to approve each run. RELEASING.md has the setup.
    if: github.repository == 'Arora-Sir/Super-Artemis' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      NDK_VERSION: 27.0.12077973
    steps:
      - name: Checkout the tag and the native submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Tag commit must be on unified-main
        run: |
          git fetch origin unified-main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/unified-main || { echo "::error::Tag $TAG is not on unified-main"; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install the NDK with the SDK of the runner
        run: |
          # NOTE: The runner image already has the Android SDK. The setup-android action ran `sdkmanager tools`, which the current command line tools no longer have, and failed the job.
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;${NDK_VERSION}"

      - name: Tag must equal v plus versionName
        run: python scripts/release/check_version.py --tag "$TAG"

      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "::error::Environment secret $name is missing"
              missing=1
            fi
          done
          exit $missing

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleNonRoot_gameRelease --stacktrace

      - name: Stage the signed APK under its stable name
        run: |
          set -eu
          apk=$(ls app/build/outputs/apk/nonRoot_game/release/SuperArtemis-*-arm64-v8a-release.apk 2>/dev/null | head -1 || true)
          if [ -z "$apk" ]; then
            echo "::error::The arm64-v8a release APK was not produced."
            ls -la app/build/outputs/apk/nonRoot_game/release || true
            exit 1
          fi
          mkdir -p dist
          cp "$apk" "dist/SuperArtemis-${TAG}-arm64-v8a.apk"

      - name: Verify signature, certificate, permission allow-list and launcher
        env:
          EXPECTED_CERT: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          set -eu
          expect=""
          if [ -n "${EXPECTED_CERT:-}" ]; then expect="--expect-cert-sha256 ${EXPECTED_CERT}"; fi
          tag_ver="${TAG#v}"
          base_ver="${tag_ver%%-*}"
          # shellcheck disable=SC2086
          python scripts/release/verify_release.py "dist/SuperArtemis-${TAG}-arm64-v8a.apk" --expect-version "$base_ver" --cert-out dist/cert.txt $expect

      - name: Write checksums and release notes
        run: |
          set -eu
          (cd dist && sha256sum "SuperArtemis-${TAG}-arm64-v8a.apk" > SHA256SUMS.txt)
          grep -Eq "^[0-9a-f]{64}  SuperArtemis-${TAG}-arm64-v8a\.apk$" dist/SHA256SUMS.txt
          python scripts/release/release_notes.py "$TAG" --cert-file dist/cert.txt > dist/RELEASE_NOTES.md

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "$TAG" \
            "dist/SuperArtemis-${TAG}-arm64-v8a.apk" dist/SHA256SUMS.txt \
            --draft --verify-tag \
            --title "Super Artemis ${TAG}" \
            --notes-file dist/RELEASE_NOTES.md
