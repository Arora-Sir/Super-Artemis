name: Build Super Artemis release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.0.12077973

    steps:
      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set. Run scripts/setup-release-signing.ps1 first."
              missing=1
            fi
          done
          exit $missing

      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager --install "ndk;${NDK_VERSION}"

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleNonRoot_gameRelease

      - name: Verify signature, package name and version
        run: |
          APK_PATH=$(ls app/build/outputs/apk/nonRoot_game/release/SuperArtemis-*-arm64-v8a-release.apk)
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify -v "$APK_PATH"
          BADGING=$("$BUILD_TOOLS/aapt2" dump badging "$APK_PATH")
          echo "$BADGING" | grep "package: name='com.mohitarora.superartemis'"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION_NAME=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
            if [ "v$VERSION_NAME" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match versionName $VERSION_NAME in app/build.gradle"
              exit 1
            fi
          fi

      - name: Name APK after the release tag
        id: rename
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="$GITHUB_REF_NAME"; else VERSION="build-${GITHUB_SHA::7}"; fi
          OUT="SuperArtemis-${VERSION}-arm64-v8a.apk"
          cp "$APK_PATH" "$OUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperArtemis-arm64-v8a
          path: ${{ steps.rename.outputs.apk }}

      # Hand-written notes for the tag when they exist, otherwise the generated Thanks section from credits.json
      - name: Pick release notes
        if: github.ref_type == 'tag'
        id: notes
        run: |
          NOTES=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES" ]; then
            NOTES="release-notes.md"
            python3 scripts/render_credits.py --release-notes > "$NOTES"
          fi
          echo "path=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Super Artemis ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: ${{ steps.rename.outputs.apk }}

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
